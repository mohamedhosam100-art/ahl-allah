<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/ahl-allah/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="إدارة الطلاب والحلقات القرآنية دون اتصال بالإنترنت.">
  <meta name="theme-color" content="#0B2239">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="أَهْلُ اللَّه">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>أَهْلُ اللَّه</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // Automatic silent self-updating script for Flutter Web
    (async function() {
      try {
        const res = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          const serverVersion = data.version;
          const storedVersion = localStorage.getItem('app_build_version');
          if (serverVersion) {
            if (!storedVersion) {
              localStorage.setItem('app_build_version', serverVersion);
            } else if (storedVersion !== serverVersion) {
              localStorage.setItem('app_build_version', serverVersion);
              if ('serviceWorker' in navigator) {
                const registrations = await navigator.serviceWorker.getRegistrations();
                for (let registration of registrations) {
                  await registration.unregister();
                }
              }
              if ('caches' in window) {
                const keys = await caches.keys();
                for (let key of keys) {
                  await caches.delete(key);
                }
              }
              window.location.reload(true);
              return;
            }
          }
        }
      } catch (e) {
        console.error('Auto-update check failed:', e);
      }
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
